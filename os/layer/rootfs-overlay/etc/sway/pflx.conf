output * scale 1
xwayland disable

default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
seat * hide_cursor 1

exec_always --no-startup-id /usr/local/bin/pflx-bitedj-supervisor

# Recovery shortcuts remain available with a connected keyboard.
bindsym Ctrl+Alt+r exec /usr/local/bin/pflx-bitedj-restart
bindsym Ctrl+Alt+t exec foot
bindsym Ctrl+Alt+k exec wvkbd-mobintl
