# Audio threads are explicitly isolated and scheduled SCHED_FIFO. Do not impose
# the default 50 ms RT throttle once they cross 95 percent of an isolated CPU.
kernel.sched_rt_runtime_us = -1

# Avoid swapping live audio pages. The image also runs swapoff before BiteDJ.
vm.swappiness = 1

# Keep large background writes from monopolising storage during playback.
vm.dirty_background_ratio = 2
vm.dirty_ratio = 8
